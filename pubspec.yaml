name: z2_mini
description: Z2 Manager Mini - Liquid Glass Edition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.3.9
  tray_manager: ^0.2.3
  file_picker: ^8.0.0+1
  url_launcher: ^6.2.5
  audioplayers: ^6.1.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lock.ico
    - assets/unlock.ico
    - assets/CRM 10.wav
    - assets/CRS 5.wav
    - assets/Ui.wav
    - assets/Ui2.wav
    - assets/Ui3.mp3
    - assets/neverlose.wav
    - assets/z2m_black_logo_256.png